<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLMR · Singles — CD TRCKAS</title>
<meta name="description" content="Escucha los 28 singles de KLMR: CD TRCKAS.">
<style>
:root{--bg:#07060f;--card:#14122a;--cy:#38e8ff;--pk:#ff3df0;--go:#ffc94d;--tx:#f4f3ff;--mu:#9a98c0}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 15% -10%,#2a0f4d55,transparent),radial-gradient(900px 500px at 100% 0,#00496655,transparent),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:84px}
header{text-align:center;padding:34px 16px 18px}
h1{font-size:clamp(28px,6vw,52px);letter-spacing:.04em;background:linear-gradient(90deg,var(--cy),var(--pk),var(--go));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--mu);margin-top:8px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1300px;margin:0 auto;padding:12px 16px 24px}
.card{position:relative;aspect-ratio:9/16;border:0;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card);box-shadow:0 6px 22px #0008;transition:transform .2s,box-shadow .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px) scale(1.02);box-shadow:0 10px 30px #38e8ff55;outline:2px solid var(--cy)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card.on{outline:2px solid var(--pk)}
.card span{position:absolute;left:8px;bottom:8px;background:#000a;color:var(--tx);font-size:12px;padding:3px 8px;border-radius:99px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:8px 16px}
#pv{position:fixed;inset:0;z-index:5;overflow:auto;background:#07060f;display:none;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#pv.show{display:block}
#bg{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(48px) brightness(.45);z-index:-1}
.wrap{max-width:440px;margin:0 auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%}
#back{align-self:flex-start;background:#ffffff1a;color:var(--tx);border:0;border-radius:99px;padding:9px 16px;font-size:15px;cursor:pointer}
#cv{width:100%;max-height:60vh;object-fit:contain;border-radius:16px;box-shadow:0 14px 50px #000a}
#tt{font-size:22px;text-align:center;line-height:1.25}
#st{color:var(--mu);text-align:center;margin-top:-8px;min-height:1.2em}
#sk{width:100%;accent-color:var(--cy);height:24px}
.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin-top:-8px}
.ct{display:flex;justify-content:center;align-items:center;gap:22px}
.ct button{background:#ffffff1a;color:var(--tx);border:0;border-radius:50%;width:54px;height:54px;font-size:22px;cursor:pointer}
.ct button#pp{width:76px;height:76px;font-size:30px;background:linear-gradient(135deg,var(--cy),var(--pk));color:#07060f}
button:focus-visible{outline:2px solid var(--go);outline-offset:2px}
#msg{color:#ff8a8a;text-align:center;min-height:1.2em;font-size:14px}
#mini{position:fixed;left:0;right:0;bottom:0;z-index:4;display:none;align-items:center;gap:12px;background:#14122af2;border-top:1px solid #38e8ff55;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0));cursor:pointer}
#mini.show{display:flex}
#mini img{width:34px;height:60px;object-fit:cover;border-radius:6px}
#mini b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini button{background:var(--cy);color:#07060f;border:0;border-radius:50%;width:42px;height:42px;font-size:17px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>KLMR · SINGLES</h1>
  <p>CD TRCKAS · 28 canciones · toca una portada para escucharla completa</p>
</header>
<main id="grid" aria-label="Singles"></main>
<footer>Solo escucha en línea · © KLMR · Todos los derechos reservados</footer>

<div id="mini"><img id="mi" alt=""><b id="mt"></b><button id="mp" aria-label="Reproducir o pausar">▶</button></div>

<section id="pv" aria-label="Reproductor">
  <div id="bg"></div>
  <div class="wrap">
    <button id="back">← Todos los singles</button>
    <img id="cv" alt="Portada del single">
    <h2 id="tt"></h2><p id="st"></p>
    <input id="sk" type="range" min="0" max="1000" value="0" aria-label="Posición">
    <div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div>
    <div class="ct">
      <button id="pr" aria-label="Anterior">⏮</button>
      <button id="pp" aria-label="Reproducir o pausar">▶</button>
      <button id="nx" aria-label="Siguiente">⏭</button>
    </div>
    <p id="msg" role="status" aria-live="polite"></p>
  </div>
</section>

<script>
// Audio completo ya publicado en la plataforma (MP3 01..28). Si pones esta carpeta
// dentro del mismo proyecto de Vercel, cambia AUDIO_BASE a "/audio/".
const AUDIO_BASE = "https://cd-trckas-plataforma.vercel.app/audio/";
const T = [
["A dos cuerdas",""],["Baila","VRemix · djklmr"],["Baila Baila Baila","Ritmo pa soñar"],["De Quintana Roo a tu piel",""],
["Dj klmr","Bailando al ritmo de la noche"],["Don't let me go",""],["Emana",""],["Es amor en el Caribe",""],
["I'm just a DJ","Female voice · English version"],["I'm just a DJ","Male voice · English version"],
["Le ciel est lourd au-dessus de nous",""],["Le faisait l'amour en pensant à toi",""],["Luz de Tulum",""],
["Soy solo un DJ","Versión en español latino"],["Stay for a while",""],["Sunshine Afro-Costa",""],
["Sunshine Afro-Costa","Versión básica para canción cristiana"],["Sunshine Tribal",""],["Todavía en el mismo lugar",""],
["Un Solo Latido V2",""],["Un Solo Latido",""],["Una sola cuerda",""],["Vamos a vivir",""],["Ya no vivo aquí",""],
["LA infiel, siempre fui yo",""],["La culpa no era mía",""],["No es mi culpa, es toda tuya",""],["Yo fui quien falló",""]];
const $ = id => document.getElementById(id), pad = n => String(n).padStart(2, "0");
const a = new Audio(); a.preload = "none";
let cur = 0, want = false, drag = false;

$("grid").innerHTML = T.map((t, i) =>
  `<button class="card" data-n="${i+1}" aria-label="Escuchar ${pad(i+1)} ${t[0]}"><img loading="lazy" src="covers/${pad(i+1)}.jpg" alt=""><span>${pad(i+1)}</span></button>`).join("");
$("grid").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) go(+c.dataset.n, true); });

function go(n, play) { want = !!play; const h = "#/" + n; if (location.hash === h) route(); else location.hash = h; }
function fmt(s) { if (!isFinite(s)) return "0:00"; return Math.floor(s/60) + ":" + pad(Math.floor(s%60)); }
function load(n) {
  cur = n; a.src = AUDIO_BASE + pad(n) + ".mp3";
  const t = T[n-1], img = "covers/" + pad(n) + ".jpg";
  $("tt").textContent = t[0]; $("st").textContent = t[1] || "KLMR · CD TRCKAS";
  $("cv").src = img; $("bg").style.backgroundImage = `url(${img})`;
  $("mi").src = img; $("mt").textContent = pad(n) + " · " + t[0] + (t[1] ? " — " + t[1] : "");
  $("msg").textContent = ""; $("sk").value = 0; $("t1").textContent = "0:00"; $("t2").textContent = "0:00";
  document.title = t[0] + " · KLMR";
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("on", +c.dataset.n === n));
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t[0], artist: "KLMR", album: "CD TRCKAS", artwork: [{ src: new URL(img, location.href).href, sizes: "540x960", type: "image/jpeg" }] });
    navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
    navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
  }
}
function route() {
  const m = location.hash.match(/^#\/(\d+)$/), n = m ? +m[1] : 0;
  if (n >= 1 && n <= T.length) {
    if (n !== cur) load(n);
    $("pv").classList.add("show"); document.body.style.overflow = "hidden";
    if (want) { a.play().catch(() => {}); want = false; }
  } else { $("pv").classList.remove("show"); document.body.style.overflow = ""; document.title = "KLMR · Singles — CD TRCKAS"; }
  $("mini").classList.toggle("show", cur > 0 && !$("pv").classList.contains("show"));
}
function step(d) { go(((cur - 1 + d + T.length) % T.length) + 1, true); }
function toggle() { if (!cur) return; a.paused ? a.play().catch(() => { $("msg").textContent = "No se pudo reproducir el audio."; }) : a.pause(); }

$("pp").onclick = toggle; $("mp").onclick = e => { e.stopPropagation(); toggle(); };
$("pr").onclick = () => step(-1); $("nx").onclick = () => step(1);
$("back").onclick = () => { location.hash = ""; history.replaceState(null, "", location.pathname + location.search); route(); };
$("mini").onclick = () => go(cur, false);
a.addEventListener("play", () => { $("pp").textContent = $("mp").textContent = "⏸"; });
a.addEventListener("pause", () => { $("pp").textContent = $("mp").textContent = "▶"; });
a.addEventListener("ended", () => step(1));
a.addEventListener("loadedmetadata", () => { $("t2").textContent = fmt(a.duration); });
a.addEventListener("timeupdate", () => { $("t1").textContent = fmt(a.currentTime); if (!drag && a.duration) $("sk").value = a.currentTime / a.duration * 1000; });
a.addEventListener("error", () => { $("msg").textContent = "No se pudo cargar el audio. Revisa tu conexión e inténtalo de nuevo."; });
$("sk").addEventListener("input", () => { drag = true; $("t1").textContent = fmt($("sk").value / 1000 * a.duration); });
$("sk").addEventListener("change", () => { if (a.duration) a.currentTime = $("sk").value / 1000 * a.duration; drag = false; });
// Solo escucha: sin enlaces ni botón de descarga, sin menú contextual en portadas/reproductor.
document.addEventListener("contextmenu", e => { if (e.target.closest("#pv,.card,#mini")) e.preventDefault(); });
document.addEventListener("keydown", e => { if (e.code === "Space" && $("pv").classList.contains("show") && e.target.tagName !== "BUTTON") { e.preventDefault(); toggle(); } });
addEventListener("hashchange", route); route();
</script>
</body>
</html>
